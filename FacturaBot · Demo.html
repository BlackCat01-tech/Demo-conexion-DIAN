<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FacturaBot · Demo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f2;--card:#fff;--tx:#18221f;--mut:#5f6f69;--bd:#dde3df;--ac:#0b6b57;--acx:#fff;--ok:#15803d;--wn:#a16207;--er:#b91c1c;--inf:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#16201d;--tx:#e5ede9;--mut:#95a7a0;--bd:#26332f;--ac:#34d399;--acx:#06231a;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--inf:#60a5fa}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#16201d;--tx:#e5ede9;--mut:#95a7a0;--bd:#26332f;--ac:#34d399;--acx:#06231a;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;--inf:#60a5fa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
h2{font-size:15px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
button{font:inherit}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.k{text-align:center;margin:0}.k b{display:block;font-size:24px}.k span{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
td input{min-width:90px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.bd{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.Aceptada{color:var(--ok)}.Rechazada{color:var(--er)}.Emitida{color:var(--inf)}.Pendiente,.Borrador{color:var(--wn)}
.bub{max-width:82%;padding:8px 10px;border-radius:10px;margin:6px 0;white-space:pre-wrap}
.bub.in{background:var(--bd)}.bub.bot{background:var(--ac);color:var(--acx);margin-left:auto}
.bub .b{margin-top:6px;color:var(--tx)}
pre{background:var(--bg);border:1px solid var(--bd);padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}
ol li{margin-bottom:6px}#toast{min-height:20px;color:var(--ok);font-size:13px}
</style></head><body><div class="w">
<h1>FacturaBot<small>Demo del flujo WhatsApp → factura electrónica. Los datos viven en tu navegador y la respuesta de la DIAN es simulada.</small></h1>
<nav id="nav"></nav><div id="toast"></div><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COP=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const W=[3,7,13,17,19,23,29,37,41,43,47,53,59,67,71];
const dv=n=>{let s=0;String(n).replace(/\D/g,"").split("").reverse().forEach((x,i)=>s+=x*(W[i]||0));const r=s%11;return r<2?r:11-r};
const KEY="facturabot-demo";
let S={cfg:{nit:"901234567",rs:"Mi Empresa S.A.S.",pref:"SETP",res:"18760000001",rf:"2026-01-01",rd:990000000,rh:995000000,amb:"Habilitación",prov:"",url:""},
cl:[{id:1,tipo:"NIT",num:"900123456",nom:"Distribuciones El Faro S.A.S.",mail:"contabilidad@elfaro.co",tel:"573001112233",muni:"Medellín",resp:"O-48 Responsable de IVA"}],
inv:[],log:[],seq:990000001,msgs:[],seen:[],last:""};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const L=m=>{S.log.unshift(new Date().toLocaleTimeString("es-CO")+" · "+m);S.log=S.log.slice(0,40)};
const tst=s=>{$("#toast").textContent=s;setTimeout(()=>$("#toast").textContent="",3000)};
const nd=()=>({tipo:"Factura de venta",cid:"",items:[{d:"",q:1,v:0,iva:19}],pago:"Contado",medio:"Transferencia",rete:0,venc:"",obs:""});
const tot=(it,rt)=>{let s=0,v=0;it.forEach(x=>{s+=x.q*x.v;v+=x.q*x.v*x.iva/100});const r=s*rt/100;return{s,v,r,t:s+v-r}};
const opt=(a,sel)=>a.map(x=>`<option ${x==sel?"selected":""}>${esc(x)}</option>`).join("");
const fld=(l,h)=>`<div><label>${l}</label>${h}</div>`;
const nm=id=>(S.cl.find(c=>c.id==id)||{}).nom||"—";
const cufe=()=>Array.from({length:20},()=>Math.floor(Math.random()*16).toString(16)).join("")+"…";
const bot=t=>S.msgs.push({w:"bot",t});
let tab="panel",D=nd();
const T={panel:"Panel",nueva:"Nueva factura",cl:"Clientes",wa:"Bandeja WhatsApp",cfg:"Emisor",guia:"Guía WhatsApp"};
const go=t=>{tab=t;draw()};
function draw(){$("#nav").innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("");$("#main").innerHTML=V[tab]();if(tab=="nueva")calc()}
function calc(){const t=tot(D.items,D.rete);$("#tt").innerHTML=`Subtotal ${COP(t.s)} · IVA ${COP(t.v)} · ReteFuente −${COP(t.r)} · <b>Total ${COP(t.t)}</b>`}
function saveInv(est){if(!D.cid)return tst("Selecciona un cliente.");const it=D.items.filter(x=>x.d&&x.q>0&&x.v>0);if(!it.length)return tst("Agrega al menos un ítem con descripción, cantidad y valor.");
const t=tot(it,D.rete),i={...D,id:Date.now(),num:S.cfg.pref+(S.seq++),cid:+D.cid,items:it,t:t.t,est,orig:"Web",fecha:new Date().toISOString().slice(0,10)};
if(est=="Emitida")i.cufe=cufe();S.inv.unshift(i);L(`${i.num} creada (${est})`);D=nd();save();go("panel")}
function act(id,a){const i=S.inv.find(x=>x.id==id);if(!i)return;
if(a=="emit"){i.est="Emitida";i.cufe=cufe();L(`${i.num} enviada al proveedor`);if(i.orig=="WhatsApp")bot(`Factura ${i.num} emitida. CUFE: ${i.cufe}`)}
if(a=="dian"){const m=["NIT del adquirente con DV inválido","Código de municipio no válido","Resolución de numeración vencida"];if(Math.random()<.8){i.est="Aceptada";i.motivo="";L(`${i.num} aceptada por la DIAN`)}else{i.est="Rechazada";i.motivo=m[Math.floor(Math.random()*3)];L(`${i.num} rechazada: ${i.motivo}`)}}
if(a=="nc"){S.inv.unshift({...i,id:Date.now(),num:S.cfg.pref+(S.seq++),tipo:"Nota crédito",ref:i.num,est:"Borrador",cufe:""});L(`Nota crédito sobre ${i.num}`)}
if(a=="del"){S.inv=S.inv.filter(x=>x.id!=id);L(`${i.num} cancelada`);bot("Solicitud cancelada.")}
save();draw()}
function addCl(){const g=k=>$("#c_"+k).value.trim(),c={id:Date.now(),tipo:g("tipo"),num:g("num"),nom:g("nom"),mail:g("mail"),tel:g("tel"),muni:g("muni"),resp:g("resp")};
if(!c.num||!c.nom||!c.mail)return tst("Número de identificación, nombre y correo son obligatorios.");S.cl.push(c);L("Cliente "+c.nom);save();draw()}
function recv(dup){const t=$("#wt").value.trim();if(!t)return;const id=dup&&S.last?S.last:"wamid."+Math.random().toString(36).slice(2,9);S.last=id;S.msgs.push({w:"in",t:t+"\n["+id+"]"});
if(S.seen.includes(id)){bot("Duplicado ignorado: el mensaje ya se procesó y no se genera otra factura.");L("Duplicado ignorado "+id)}
else{S.seen.push(id);const c=S.cl.find(x=>t.includes(x.num)),it=[...t.matchAll(/(\d+)\s+([a-záéíóúñ ]+?)\s+a\s+\$?(\d[\d.]*)/gi)].map(m=>({d:m[2].trim(),q:+m[1],v:+m[3].replace(/\./g,""),iva:19}));
if(!c)bot("No encuentro al cliente. Indícame un NIT o cédula registrado.");
else if(!it.length)bot("¿Qué ítems facturo? Usa el formato “2 licencias a 150000”.");
else{const tt=tot(it,0),i={id:Date.now(),num:S.cfg.pref+(S.seq++),tipo:"Factura de venta",cid:c.id,items:it,t:tt.t,est:"Pendiente",orig:"WhatsApp",msg:id,fecha:new Date().toISOString().slice(0,10),pago:"Contado",medio:"Transferencia",rete:0};S.inv.unshift(i);S.msgs.push({w:"bot",t:`Factura a ${c.nom} (NIT ${c.num}-${dv(c.num)})\nTotal con IVA: ${COP(tt.t)}\n¿Confirmas?`,inv:i.id});L(`${i.num} creada desde WhatsApp`)}}
save();draw()}
const V={
panel(){const c=e=>S.inv.filter(i=>i.est==e).length;
return `<div class="g4">${["Borrador","Pendiente","Emitida","Aceptada","Rechazada"].map(e=>`<div class="card k"><b>${c(e)}</b><span>${e}</span></div>`).join("")}</div>
<div class="card"><h2>Documentos</h2><div class="sc"><table><tr><th>Número</th><th>Tipo</th><th>Cliente</th><th>Total</th><th>Origen</th><th>Estado</th><th>CUFE / motivo</th><th></th></tr>
${S.inv.map(i=>`<tr><td>${i.num}</td><td>${i.tipo}${i.ref?" ("+i.ref+")":""}</td><td>${esc(nm(i.cid))}</td><td>${COP(i.t)}</td><td>${i.orig}</td><td><span class="bd ${i.est}">${i.est}</span></td><td>${esc(i.motivo||i.cufe||"")}</td><td>${
i.est=="Borrador"||i.est=="Pendiente"||i.est=="Rechazada"?`<button class="b" onclick="act(${i.id},'emit')">${i.est=="Rechazada"?"Reintentar":"Emitir"}</button>`:i.est=="Emitida"?`<button class="b" onclick="act(${i.id},'dian')">Respuesta DIAN</button>`:`<button class="b" onclick="act(${i.id},'nc')">Nota crédito</button>`}</td></tr>`).join("")||`<tr><td colspan="8" class="mut">Aún no hay documentos. Crea uno o simula un mensaje en Bandeja WhatsApp.</td></tr>`}</table></div></div>
<div class="card"><h2>Bitácora de auditoría</h2>${S.log.map(l=>`<div class="mut">${esc(l)}</div>`).join("")||`<div class="mut">Sin eventos.</div>`}</div>`},
nueva(){const c=S.cl.map(x=>`<option value="${x.id}" ${x.id==D.cid?"selected":""}>${esc(x.nom)} · ${esc(x.num)}</option>`).join("");
return `<div class="card"><h2>Nuevo documento electrónico</h2><div class="g">
${fld("Tipo de documento",`<select onchange="D.tipo=this.value">${opt(["Factura de venta","Nota crédito","Nota débito","Documento soporte"],D.tipo)}</select>`)}
${fld("Cliente",`<select onchange="D.cid=this.value"><option value="">Selecciona…</option>${c}</select>`)}
${fld("Forma de pago",`<select onchange="D.pago=this.value">${opt(["Contado","Crédito"],D.pago)}</select>`)}
${fld("Medio de pago",`<select onchange="D.medio=this.value">${opt(["Transferencia","Efectivo","Tarjeta","Cheque"],D.medio)}</select>`)}
${fld("Vencimiento",`<input type="date" value="${D.venc}" onchange="D.venc=this.value">`)}
${fld("ReteFuente %",`<input type="number" value="${D.rete}" oninput="D.rete=+this.value;calc()">`)}</div></div>
<div class="card"><h2>Ítems</h2><div class="sc"><table><tr><th>Descripción</th><th>Cant.</th><th>Valor unitario</th><th>IVA %</th><th></th></tr>
${D.items.map((x,i)=>`<tr><td><input value="${esc(x.d)}" oninput="D.items[${i}].d=this.value"></td><td><input type="number" value="${x.q}" oninput="D.items[${i}].q=+this.value;calc()"></td><td><input type="number" value="${x.v}" oninput="D.items[${i}].v=+this.value;calc()"></td><td><select onchange="D.items[${i}].iva=+this.value;calc()">${opt([0,5,19],x.iva)}</select></td><td><button class="b" onclick="D.items.splice(${i},1);draw()">Quitar</button></td></tr>`).join("")}</table></div>
<button class="b" onclick="D.items.push({d:'',q:1,v:0,iva:19});draw()">Agregar ítem</button>
<div style="margin:12px 0" id="tt"></div>${fld("Observaciones",`<textarea rows="2" oninput="D.obs=this.value">${esc(D.obs)}</textarea>`)}
<p><button class="b" onclick="saveInv('Borrador')">Guardar borrador</button> <button class="b" onclick="saveInv('Pendiente')">Pedir confirmación por WhatsApp</button> <button class="b p" onclick="saveInv('Emitida')">Emitir</button></p></div>`},
cl(){return `<div class="card"><h2>Clientes (adquirentes)</h2><div class="sc"><table><tr><th>Identificación</th><th>Nombre</th><th>Correo</th><th>WhatsApp</th><th>Municipio</th><th>Responsabilidad</th></tr>
${S.cl.map(c=>`<tr><td>${c.tipo} ${esc(c.num)}${c.tipo=="NIT"?"-"+dv(c.num):""}</td><td>${esc(c.nom)}</td><td>${esc(c.mail)}</td><td>${esc(c.tel)}</td><td>${esc(c.muni)}</td><td>${esc(c.resp)}</td></tr>`).join("")}</table></div></div>
<div class="card"><h2>Nuevo cliente</h2><div class="g">
${fld("Tipo de identificación",`<select id="c_tipo">${opt(["NIT","CC","CE","Pasaporte"])}</select>`)}${fld("Número (el DV se calcula en la lista)",`<input id="c_num">`)}${fld("Razón social o nombre",`<input id="c_nom">`)}${fld("Correo de facturación",`<input id="c_mail" type="email">`)}${fld("WhatsApp (con indicativo)",`<input id="c_tel" placeholder="573001112233">`)}${fld("Municipio",`<input id="c_muni">`)}${fld("Responsabilidad fiscal",`<select id="c_resp">${opt(["O-47 Régimen simple","O-48 Responsable de IVA","O-49 No responsable de IVA","R-99-PN No aplica"])}</select>`)}</div>
<p><button class="b p" onclick="addCl()">Guardar cliente</button></p></div>`},
wa(){const m=S.msgs.map(x=>{const i=x.inv&&S.inv.find(v=>v.id==x.inv);return `<div class="bub ${x.w}">${esc(x.t)}${i&&i.est=="Pendiente"?`<div><button class="b" onclick="act(${i.id},'emit')">Confirmar</button> <button class="b" onclick="act(${i.id},'del')">Cancelar</button></div>`:""}</div>`}).join("");
return `<div class="card"><h2>Simulador del chat</h2><p class="mut">Hace lo mismo que hará el webhook real: recibe el mensaje, extrae cliente e ítems, pide confirmación y emite. Usa el NIT ${esc(S.cl[0]?S.cl[0].num:"")} para la prueba.</p>
<textarea id="wt" rows="2">Factura a NIT ${S.cl[0]?S.cl[0].num:"900123456"}: 2 licencias a 150000 y 1 soporte a 80000</textarea>
<p><button class="b p" onclick="recv(false)">Recibir mensaje</button> <button class="b" onclick="recv(true)">Reenviar el mismo mensaje (duplicado)</button> <button class="b" onclick="S.msgs=[];save();draw()">Limpiar chat</button></p>${m||`<div class="mut">Sin mensajes todavía.</div>`}</div>`},
cfg(){const c=S.cfg,F=[["nit","NIT del emisor"],["rs","Razón social"],["pref","Prefijo de numeración"],["res","Resolución DIAN"],["rf","Fecha de resolución","date"],["rd","Rango desde","number"],["rh","Rango hasta","number"],["prov","Proveedor tecnológico"],["url","URL base de su API"]];
return `<div class="card"><h2>Datos del emisor y numeración</h2><div class="g">${F.map(([k,l,t])=>fld(l,`<input type="${t||"text"}" value="${esc(c[k])}" oninput="S.cfg.${k}=this.value">`)).join("")}${fld("Ambiente",`<select onchange="S.cfg.amb=this.value">${opt(["Habilitación","Producción"],c.amb)}</select>`)}</div>
<p class="mut">Los secretos (tokens y claves) no se guardan aquí: van en variables de entorno del servidor.</p><button class="b p" onclick="save();tst('Datos del emisor guardados.')">Guardar emisor</button></div>`},
guia(){return `<div class="card"><h2>Guía para conectar WhatsApp Business Cloud API</h2><ol>
<li><b>Cuenta en Meta.</b> Entra a developers.facebook.com, crea una app de tipo Business y agrega el producto WhatsApp.</li>
<li><b>Credenciales.</b> En WhatsApp → API Setup copia el <i>Phone Number ID</i> y genera un token. El temporal dura 24 h; para producción crea un usuario del sistema en Business Settings y genera un token permanente. El App Secret está en Settings → Basic.</li>
<li><b>Servidor.</b> Con Node 18 o superior ejecuta <code>npm i express</code>, define las variables de abajo y corre <code>node server.js</code>.</li>
<li><b>URL pública con HTTPS.</b> Para pruebas usa Cloudflare Tunnel o ngrok apuntando al puerto 3000. En producción, un servidor con dominio y certificado.</li>
<li><b>Webhook.</b> En WhatsApp → Configuration pega <code>https://tu-dominio/webhook</code> y el mismo VERIFY_TOKEN. Suscríbete al campo <code>messages</code>.</li>
<li><b>Prueba.</b> Agrega tu celular como destinatario del número de prueba, envía “Factura a NIT …: 2 licencias a 150000” y revisa el log del servidor.</li>
<li><b>Conecta la facturación.</b> Completa <code>emitInvoice()</code> con la API de tu proveedor y <code>extractInvoiceData()</code> con un LLM que devuelva JSON.</li>
<li><b>Producción.</b> Verifica tu negocio en Meta, registra un número propio y aprueba plantillas: fuera de la ventana de 24 h solo puedes enviar plantillas.</li></ol>
<pre>VERIFY_TOKEN=una-clave-larga-inventada
APP_SECRET=secreto-de-la-app-meta
WA_TOKEN=token-de-acceso
WA_PHONE_ID=id-del-numero
INVOICE_API_URL=https://api.proveedor.com/invoices
INVOICE_API_KEY=clave-del-proveedor</pre>
<p class="mut">Seguridad: el servidor valida la firma X-Hub-Signature-256, ignora mensajes repetidos (idempotencia) y nunca expone los tokens al navegador. El archivo server.js se entrega junto a esta página.</p></div>`}};
draw();
</script></body></html>
